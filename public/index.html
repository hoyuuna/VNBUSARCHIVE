    <style>
        body { margin: 0; background: #ffffff; overflow: hidden; }
        

        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }

        .text-wrapper { display: grid; grid-template-columns: 0fr; opacity: 0; animation: slideOut 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
        .text-inner { overflow: hidden; white-space: nowrap; }

        @media (max-width: 768px) { .logo { height: 60px; } .text-inner span { font-size: 1.8rem; padding-left: 12px; } }

<body>
    <div id="loading-screen">
        <div class="brand-container">
            <img src="/media/vnba.png" alt="Logo" class="logo">
            <div class="text-wrapper"><div class="text-inner"><span>VNBUSARCHIVE</span></div></div>
        </div>
        <div class="spinner"></div>
    </div>

    <script>

        
    var _pInt = null;
    (function() {
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault(); return false;
            }
        });
        
        const ua = (navigator.userAgent || '').toLowerCase();
        const isBot = /bot|crawler|spider|lighthouse|inspection|google|bing|yandex|baidu|slurp|facebook|twitter|discord|telegram|applebot|page-speed|gtmetrix|headless|chrome-lighthouse/i.test(ua) || navigator.webdriver;
        if (isBot || sessionStorage.getItem('VNBA_SESS_AUTH') === 'active') return;

        _pInt = setInterval(function() {
            const before = new Date().getTime();
            debugger; 
            if (new Date().getTime() - before > 100) {
                document.body.innerHTML = "<h1 style='text-align:center; margin-top:20vh; font-family:sans-serif;'>Hành vi bị cấm!</h1>";
            }
        }, 100);
    })();
        


        async function initApp() {
            try {
                let token = null;

                // 1. Kiểm tra Token từ URL (trường hợp OAuth Callback)
                if (window.location.hash) {
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    if (hashParams.has('access_token')) {
                        token = hashParams.get('access_token');
                    }
                }

                // 2. Fallback sang LocalStorage (đã login từ trước)
                if (!token) {
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                            try {
                                const session = JSON.parse(localStorage.getItem(key));
                                token = session.access_token;
                                break;
                            } catch (e) {}
                        }
                    }
                }

                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const response = await fetch('/api/system', { method: 'POST', headers: headers, body: JSON.stringify({ action: 'core' }) });
                
                if (response.status === 403) {
                    const data = await response.json();
                    if (data.banned) {
                        clearInterval(_pInt);
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                                localStorage.removeItem(key);
                            }
                        }
                        sessionStorage.removeItem('VNBA_SESS_AUTH');
                        
                        // Clear OAuth tokens from URL
                        if (window.location.hash.includes('access_token')) {
                            history.replaceState(null, '', window.location.pathname + window.location.search);
                        }

                        document.body.innerHTML = `
                            <div style="background-color: #ffffff; color: #ff0000; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 20px; box-sizing: border-box;">
                                <h1 style="font-size: 2.5rem; margin-bottom: 20px; font-weight: 900;">BẠN ĐÃ BỊ CẤM</h1>
                                <p style="font-size: 1.2rem; max-width: 600px; line-height: 1.5; margin-bottom: 30px;">
                                    Tài khoản <b>${data.name}</b> (ID: <b><span style="font-family: monospace;">${data.uuid || 'Không rõ'}</span></b>) của bạn đã bị cấm với lí do: <b>${data.reason || 'Không rõ'}</b>. 
                                    <br><br>Tìm hiểu thêm tại: <a href="https://www.vnbusarchive.io.vn/help/1516761580069720074" style="color: #ff0000; text-decoration: underline;">https://www.vnbusarchive.io.vn/help/1516761580069720074</a>
                                </p>
                                <p style="font-style: italic; color: #666; font-size: 0.9rem; margin-top: 20px;">Làm mới trang sẽ tự động đăng xuất tài khoản</p>
                            </div>
                        `;
                        return;
                    }
                }

                if (!response.ok) throw new Error('Bị từ chối');
                
                const data = await response.json();
                const decodedHTML = decodeURIComponent(escape(atob(data.payload)));

            
                document.open();
                if (sessionStorage.getItem('VNBA_SESS_AUTH') === 'active') clearInterval(_pInt);
                document.write(decodedHTML);
                document.close();

            } catch (error) {
                console.error("Lỗi:", error);
                document.getElementById('loading-screen').innerHTML = '<p style="color:red; text-align:center; margin-top: 40vh; font-weight: bold;">Mất kết nối máy chủ. Vui lòng tải lại trang hoặc tham khảo trang hỗ trợ tại: https://www.vnbusarchive.io.vn/help/1516401956581802025.</p>';
            }
        }
        initApp();
    </script>
</body>

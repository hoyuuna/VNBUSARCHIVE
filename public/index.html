====================================================================================================
   Mọi hành vi dò quét lỗ hổng, xâm nhập trái phép, dịch ngược (Reverse Engineering), 
   hoặc tự động cào dữ liệu (Scraping/Crawling) tại hệ thống này đều bị NGHIÊM CẤM.

   [HÀNH VI VI PHẠM SẼ BỊ XỬ LÝ THEO PHÁP LUẬT VIỆT NAM]:
   - Điều 287 BLHS: Tội cản trở hoặc gây rối loạn hoạt động của mạng máy tính (Tấn công DoS/DDoS) 
     => Phạt tù lên đến 12 NĂM.
   - Điều 288 BLHS: Tội đưa hoặc sử dụng trái phép thông tin mạng máy tính (Scrape/Crawl dữ liệu) 
     => Phạt tiền đến 1 TỶ ĐỒNG hoặc phạt tù đến 7 NĂM.
   - Điều 289 BLHS: Tội xâm nhập trái phép vào mạng máy tính của người khác (Hack/Bẻ khóa) 
     => Phạt tù lên đến 12 NĂM.
   - Nghị định 13/2023/NĐ-CP: Vi phạm quy định về bảo vệ dữ liệu cá nhân.

   HÃY LÀ MỘT NGƯỜI XEM ẢNH CÓ VĂN HÓA VÀ TRÁCH NHIỆM!

<body>
    <div id="loading-screen">
        <div class="brand-container">
            <img src="/media/vnba.png" alt="Logo" class="logo">
            <div class="text-wrapper"><div class="text-inner"><span>VNBUSARCHIVE</span></div></div>
        </div>
        <div class="spinner"></div>
    </div>

    <script>

        
    var _pInt = null;
    (function() {
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault(); return false;
            }
        });
        
        const ua = (navigator.userAgent || '').toLowerCase();
        const isBot = /bot|crawler|spider|lighthouse|inspection|google|bing|yandex|baidu|slurp|facebook|twitter|discord|telegram|applebot|page-speed|gtmetrix|headless|chrome-lighthouse/i.test(ua) || navigator.webdriver;
        if (isBot || sessionStorage.getItem('VNBA_SESS_AUTH') === 'active') return;

        _pInt = setInterval(function() {
            const before = new Date().getTime();
            debugger; 
            if (new Date().getTime() - before > 100) {
                document.body.innerHTML = "<h1 style='text-align:center; margin-top:20vh; font-family:sans-serif;'>Hành vi bị cấm!</h1>";
            }
        }, 100);
    })();
        


        async function initApp() {
            try {
                let token = null;

                // 1. Kiểm tra Token từ URL (trường hợp OAuth Callback)
                if (window.location.hash) {
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    if (hashParams.has('access_token')) {
                        token = hashParams.get('access_token');
                    }
                }

                // 2. Fallback sang LocalStorage (đã login từ trước)
                if (!token) {
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                            try {
                                const session = JSON.parse(localStorage.getItem(key));
                                token = session.access_token;
                                break;
                            } catch (e) {}
                        }
                    }
                }

                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const response = await fetch('/api/system', { method: 'POST', headers: headers, body: JSON.stringify({ action: 'core' }) });
                
                if (response.status === 403) {
                    const data = await response.json().catch(() => ({}));
                    if (data.banned || data.ip_banned) {
                        clearInterval(_pInt);
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                                localStorage.removeItem(key);
                            }
                        }
                        sessionStorage.removeItem('VNBA_SESS_AUTH');
                        
                        // Clear OAuth tokens from URL
                        if (window.location.hash.includes('access_token')) {
                            history.replaceState(null, '', window.location.pathname + window.location.search);
                        }

                        document.body.innerHTML = `
                            <div style="background-color: #09090b; color: #ffffff; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; user-select: none;">
                                <div style="margin-bottom: 36px; display: flex; flex-direction: column; align-items: center; gap: 14px;">
                                    <img src="/media/vnba.png" alt="VNBUSARCHIVE" style="height: 48px; width: auto; object-contain; filter: brightness(0) invert(1);">
                                </div>
                                <div style="max-width: 520px; border-top: 1px solid #27272a; border-bottom: 1px solid #27272a; padding: 36px 20px; margin-bottom: 28px;">
                                    <p style="font-size: 1.15rem; font-weight: 600; line-height: 1.75; margin: 0 0 16px 0; color: #f4f4f5;">
                                        Xin lỗi bạn, hiện tại VNBUSARCHIVE chưa có sẵn tại khu vực của bạn.
                                    </p>
                                    <p style="font-size: 0.95rem; line-height: 1.7; margin: 0; color: #a1a1aa;">
                                        Bạn vui lòng liên hệ qua email <a href="mailto:lienhe@vnbusarchive.io.vn" style="color: #ffffff; font-weight: 700; text-decoration: underline; text-underline-offset: 4px;">lienhe@vnbusarchive.io.vn</a> hoặc thử lại sau nhé!
                                    </p>
                                </div>
                                <p style="font-size: 0.75rem; letter-spacing: 0.2em; color: #52525b; text-transform: uppercase; font-weight: 600;">VIETNAM BUS ARCHIVE PROJECT</p>
                            </div>
                        `;
                        return;
                    }
                }

                if (!response.ok) throw new Error('Bị từ chối');
                
                const data = await response.json();
                const decodedHTML = decodeURIComponent(escape(atob(data.payload)));

            
                document.open();
                if (sessionStorage.getItem('VNBA_SESS_AUTH') === 'active') clearInterval(_pInt);
                document.write(decodedHTML);
                document.close();

            } catch (error) {
                console.error("Lỗi:", error);
                document.getElementById('loading-screen').innerHTML = '<p style="color:red; text-align:center; margin-top: 40vh; font-weight: bold;">Mất kết nối máy chủ. Vui lòng tải lại trang hoặc tham khảo trang hỗ trợ tại: https://www.vnbusarchive.io.vn/help/1516401956581802025.</p>';
            }
        }
        initApp();
    </script>

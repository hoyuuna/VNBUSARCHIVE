   [HÀNH VI VI PHẠM SẼ BỊ XỬ LÝ THEO PHÁP LUẬT VIỆT NAM]:
   - Điều 287 BLHS: Tội cản trở hoặc gây rối loạn hoạt động của mạng máy tính (Tấn công DoS/DDoS) 
     => Phạt tù lên đến 12 NĂM.
   - Điều 288 BLHS: Tội đưa hoặc sử dụng trái phép thông tin mạng máy tính (Scrape/Crawl dữ liệu) 
     => Phạt tiền đến 1 TỶ ĐỒNG hoặc phạt tù đến 7 NĂM.
   - Điều 289 BLHS: Tội xâm nhập trái phép vào mạng máy tính của người khác (Hack/Bẻ khóa)

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-title">VNBUSARCHIVE</title>
    
    <!-- SEO & Embed Mặc định -->
    <meta name="description" id="meta-desc" content="Hệ thống database xe buýt/khách">
    <meta property="og:type" content="website">
    <meta property="og:url" id="og-url" content="https://vnbusarchive.io.vn">
    <meta property="og:title" id="og-title" content="VNBUSARCHIVE">
    <meta property="og:description" id="og-desc" content="Hệ thống database xe buýt/khách">
    <meta property="og:image" id="og-image" content="https://files.catbox.moe/ddvw49.png">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" id="tw-url" content="https://vnbusarchive.io.vn">
    <meta property="twitter:title" id="tw-title" content="VNBUSARCHIVE">
    <meta property="twitter:description" id="tw-desc" content="Hệ thống database xe buýt/khách">
    <meta property="twitter:image" id="tw-image" content="https://files.catbox.moe/ddvw49.png">
    <meta name="theme-color" content="#FFFFFF">
    <link rel="icon" href="/media/icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; background: #ffffff; overflow: hidden; }
        

        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .brand-container { display: flex; align-items: center; justify-content: center; }
        .logo { height: 80px; object-fit: contain; position: relative; z-index: 2; }
        

        .text-wrapper { display: grid; grid-template-columns: 0fr; opacity: 0; animation: slideOut 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
        .text-inner { overflow: hidden; white-space: nowrap; }
        .text-inner span { font-family: 'Montserrat', sans-serif; font-weight: 800; font-style: italic; font-size: 2.5rem; letter-spacing: 2px; padding-left: 15px; display: block; padding-right: 5px; color: #000; }
        
        .spinner { position: absolute; bottom: 15%; width: 40px; height: 40px; border: 4px solid rgba(0, 0, 0, 0.1); border-left-color: #000000; border-radius: 50%; animation: spin 1s linear infinite; }
        
        @media (max-width: 768px) { .logo { height: 60px; } .text-inner span { font-size: 1.8rem; padding-left: 12px; } }
        @media (max-width: 480px) { .logo { height: 45px; } .text-inner span { font-size: 1.25rem; letter-spacing: 1px; padding-left: 8px; } .spinner { width: 30px; height: 30px; border-width: 3px; bottom: 12%; } }
        
        @keyframes slideOut { 0% { grid-template-columns: 0fr; opacity: 0; } 100% { grid-template-columns: 1fr; opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="brand-container">
            <img src="/media/vnba.png" alt="Logo" class="logo">
            <div class="text-wrapper"><div class="text-inner"><span>VNBUSARCHIVE</span></div></div>
        </div>
        <div class="spinner"></div>
    </div>

    <script>

        
    var _pInt = null;
    (function() {
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault(); return false;
            }
        });
        
        if (sessionStorage.getItem('VNBA_SESS_AUTH') === 'active') return;

        _pInt = setInterval(function() {
            const before = new Date().getTime();
            debugger; 
            if (new Date().getTime() - before > 100) {
                document.body.innerHTML = "<h1 style='text-align:center; margin-top:20vh; font-family:sans-serif;'>Hành vi bị cấm!</h1>";
            }
        }, 100);
    })();
        


        async function initApp() {
            try {
                const response = await fetch('/api/get-core', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                if (!response.ok) throw new Error('Bị từ chối');
                
                const data = await response.json();
                const decodedHTML = decodeURIComponent(escape(atob(data.payload)));

            
                document.open();
                if (sessionStorage.getItem('VNBA_SESS_AUTH') === 'active') clearInterval(_pInt);
                document.write(decodedHTML);
                document.close();

            } catch (error) {
                console.error("Lỗi:", error);
                document.getElementById('loading-screen').innerHTML = '<p style="color:red; text-align:center; margin-top: 40vh; font-weight: bold;">Mất kết nối máy chủ. Vui lòng tải lại trang hoặc liên hệ hỗ trợ tại lienhe@vnbusarchive.io.vn.</p>';
            }
        }
        initApp();
    </script>
</body>
</html>

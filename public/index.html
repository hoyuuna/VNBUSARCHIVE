<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNBUSARCHIVE</title>
    <link rel="icon" href="/media/icon.png">
    <style>
        body { margin: 0; background: #ffffff; overflow: hidden; }
        #loading-screen { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .brand-container { display: flex; align-items: center; justify-content: center; margin-bottom: 20px;}
        .logo { height: 80px; object-fit: contain; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(0, 0, 0, 0.1); border-left-color: #000; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="brand-container">
            <img src="https://wsrv.nl/?url=https://files.catbox.moe/crxvn6.png&we" alt="Logo" class="logo">
        </div>
        <div class="spinner"></div>
    </div>

    <script>
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (
                    e.key === 'F12' || 
                    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
                    (e.ctrlKey && e.key === 'U')
                ) {
                    e.preventDefault();
                    return false;
                }
            });
            setInterval(function() {
                const before = new Date().getTime();
                debugger; 
                const after = new Date().getTime();
                if (after - before > 100) {
                    document.body.innerHTML = "<h1 style='text-align:center; margin-top:20vh; font-family:sans-serif;'>Hanh vi bi cam!</h1>";
                }
            }, 100);
        })();

        async function initApp() {
            try {
                const response = await fetch('/api/get-core', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (!response.ok) throw new Error('Bi tu cho phep truy cap');
                const data = await response.json();
                const decodedHTML = decodeURIComponent(escape(atob(data.payload)));
                document.open();
                document.write(decodedHTML);
                document.close();
            } catch (error) {
                console.error("Khoi tao that bai.");
                document.getElementById('loading-screen').innerHTML = '<p style="color:red;">Loi ket noi may chu. Vui long tai lai trang.</p>';
            }
        }

        initApp();
    </script>
</body>
</html>

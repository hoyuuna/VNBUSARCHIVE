====================================================================================================
   Mọi hành vi dò quét lỗ hổng, xâm nhập trái phép, dịch ngược (Reverse Engineering), 
   hoặc tự động cào dữ liệu (Scraping/Crawling) tại hệ thống này đều bị NGHIÊM CẤM.

   [HÀNH VI VI PHẠM SẼ BỊ XỬ LÝ THEO PHÁP LUẬT VIỆT NAM]:
   - Điều 287 BLHS: Tội cản trở hoặc gây rối loạn hoạt động của mạng máy tính (Tấn công DoS/DDoS) 
     => Phạt tù lên đến 12 NĂM.
   - Điều 288 BLHS: Tội đưa hoặc sử dụng trái phép thông tin mạng máy tính (Scrape/Crawl dữ liệu) 
     => Phạt tiền đến 1 TỶ ĐỒNG hoặc phạt tù đến 7 NĂM.
   - Điều 289 BLHS: Tội xâm nhập trái phép vào mạng máy tính của người khác (Hack/Bẻ khóa) 
     => Phạt tù lên đến 12 NĂM.
   - Nghị định 13/2023/NĐ-CP: Vi phạm quy định về bảo vệ dữ liệu cá nhân.

   HÃY LÀ MỘT NGƯỜI XEM ẢNH CÓ VĂN HÓA VÀ TRÁCH NHIỆM!
====================================================================================================
-->

    <style>

        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }

</head>
<body>
    <div id="loading-screen">
        <div class="brand-container">
            <img src="/media/vnba.png" alt="Logo" class="logo">
            <div class="text-wrapper"><div class="text-inner"><span>VNBUSARCHIVE</span></div></div>
        </div>
        <div class="spinner"></div>
    </div>

    <script>

        
    var _pInt = null;
    (function() {
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault(); return false;
            }
        });
        
        const ua = (navigator.userAgent || '').toLowerCase();
        const isBot = /bot|crawler|spider|lighthouse|inspection|google|bing|yandex|baidu|slurp|facebook|twitter|discord|telegram|applebot|page-speed|gtmetrix|headless|chrome-lighthouse/i.test(ua) || navigator.webdriver;
        if (isBot || sessionStorage.getItem('VNBA_SESS_AUTH') === 'active') return;

        _pInt = setInterval(function() {
            const before = new Date().getTime();
            debugger; 
            if (new Date().getTime() - before > 100) {
                document.body.innerHTML = "<h1 style='text-align:center; margin-top:20vh; font-family:sans-serif;'>Hành vi bị cấm!</h1>";
            }
        }, 100);
    })();
        


        async function initApp() {
            try {
                let token = null;

                // 1. Kiểm tra Token từ URL (trường hợp OAuth Callback)
                if (window.location.hash) {
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    if (hashParams.has('access_token')) {
                        token = hashParams.get('access_token');
                    }
                }

                // 2. Fallback sang LocalStorage (đã login từ trước)
                if (!token) {
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                            try {
                                const session = JSON.parse(localStorage.getItem(key));
                                token = session.access_token;
                                break;
                            } catch (e) {}
                        }
                    }
                }

                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const response = await fetch('/api/system', { method: 'POST', headers: headers, body: JSON.stringify({ action: 'core', token: token || null }) });
                
                function renderModernStatusScreen({ title, label, reason, contactSuffix, iconSvg }) {
                    clearInterval(_pInt);
                    document.body.innerHTML = `
                        <div style="background-color: #f4f4f5; color: #09090b; width: 100vw; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; user-select: none;">
                            
                            <!-- LOGO VNBUSARCHIVE CHUẨN FOOTER -->
                            <div style="margin-bottom: 32px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <img src="/media/vnba.png" alt="VNBUSARCHIVE Logo" style="height: 38px; width: auto; object-contain;">
                                <span style="font-family: 'Montserrat', sans-serif; font-weight: 800; font-style: italic; font-size: 1.35rem; letter-spacing: 0.05em; color: #000000;">VNBUSARCHIVE</span>
                            </div>

                            <!-- KHUNG GIAO DIỆN LIGHT MODE CHUẨN HOYUUI -->
                            <div style="max-width: 520px; width: 100%; border: 1px solid #e4e4e7; background: #ffffff; border-radius: 16px; padding: 36px 28px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); margin-bottom: 24px;">
                                
                                <!-- ICON NẰM Ở GIỮA -->
                                <div style="width: 64px; height: 64px; border-radius: 50%; background: #f4f4f5; border: 1px solid #e4e4e7; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto;">
                                    ${iconSvg}
                                </div>

                                <!-- TIÊU ĐỀ VẤN ĐỀ -->
                                <h2 style="font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 16px 0; color: #09090b; text-transform: uppercase;">
                                    ${title}
                                </h2>

                                <!-- CHI TIẾT LÝ DO / LOG WEB -->
                                <div style="background: #fafafa; border: 1px solid #e4e4e7; border-radius: 10px; padding: 14px 18px; margin-bottom: 24px; text-align: left;">
                                    <div style="font-size: 0.72rem; font-weight: 700; color: #71717a; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;">
                                        ${label}
                                    </div>
                                    <div style="font-size: 0.92rem; font-weight: 500; color: #27272a; line-height: 1.6; word-break: break-word;">
                                        ${reason}
                                    </div>
                                </div>

                                <!-- LIÊN HỆ -->
                                <p style="font-size: 0.85rem; line-height: 1.65; margin: 0; color: #52525b;">
                                    Vui lòng tải lại trang hoặc liên hệ: <a href="mailto:lienhe@vnbusarchive.io.vn" style="color: #09090b; font-weight: 700; text-decoration: underline; text-underline-offset: 4px;">lienhe@vnbusarchive.io.vn</a> ${contactSuffix}
                                </p>
                            </div>

                            <p style="font-size: 0.72rem; letter-spacing: 0.22em; color: #a1a1aa; text-transform: uppercase; font-weight: 600; margin: 0;">VNBUSARCHIVE Foundation</p>
                        </div>
                    `;
                }

                if (response.status === 403) {
                    const data = await response.json().catch(() => ({}));
                    if (data.banned || data.ip_banned) {
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                                localStorage.removeItem(key);
                            }
                        }
                        sessionStorage.removeItem('VNBA_SESS_AUTH');
                        
                        if (window.location.hash.includes('access_token')) {
                            history.replaceState(null, '', window.location.pathname + window.location.search);
                        }

                        let banReason = data.reason || 'Tài khoản hoặc địa chỉ IP của bạn nằm trong danh sách hạn chế truy cập.';
                        if (data.banned && data.name) {
                            const reasonText = data.reason || 'Vi phạm quy định của VNBUSARCHIVE';
                            const uuidStr = data.uuid ? ` (<code>${data.uuid}</code>)` : '';
                            banReason = `Tài khoản <b>${data.name}</b>${uuidStr} đã bị cấm với lí do: <b>${reasonText}</b>`;
                        }
                        renderModernStatusScreen({
                            title: 'TRUY CẬP ĐÃ BỊ HẠN CHẾ',
                            label: 'LÝ DO HẠN CHẾ TRUY CẬP / BAN LOG',
                            reason: banReason,
                            contactSuffix: 'nếu bạn nghĩ đây là một sai lầm! Xin cảm ơn.',
                            iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>'
                        });
                        return;
                    }
                }

                if (!response.ok) throw new Error('Bị từ chối (Mã lỗi HTTP: ' + response.status + ')');
                
                const data = await response.json();
                const decodedHTML = decodeURIComponent(escape(atob(data.payload)));
            
                document.open();
                if (sessionStorage.getItem('VNBA_SESS_AUTH') === 'active') clearInterval(_pInt);
                document.write(decodedHTML);
                document.close();

            } catch (error) {
                console.error("Lỗi:", error);
                const errMsg = error && error.message ? error.message : 'Không thể kết nối đến máy chủ VNBUSARCHIVE.';
                renderModernStatusScreen({
                    title: 'KHÔNG THỂ KẾT NỐI ĐẾN MÁY CHỦ',
                    label: 'THÔNG TIN SỰ CỐ / WEB LOG',
                    reason: 'Hệ thống máy chủ tạm thời không phản hồi hoặc kết nối mạng gặp gián đoạn. (' + errMsg + ')',
                    contactSuffix: 'nếu sự cố vẫn tiếp diễn! Xin cảm ơn.',
                    iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>'
                });
            }
        }
        initApp();
    </script>
</body>

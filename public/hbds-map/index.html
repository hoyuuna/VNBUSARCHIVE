<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>HBDS Map</title>
    <link rel="icon" type="image/png" href="/hbds-map/logo.png">
    

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,900;1,800&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        
        :root {
            
            --md-primary: #5170ff;
            --md-on-primary: #ffffff;
            --md-primary-container: rgba(81, 112, 255, 0.15);
            --md-on-primary-container: #001799;
            
            
            --md-surface: rgba(255, 255, 255, 0.85);
            --md-surface-container: rgba(255, 255, 255, 0.5);
            --md-surface-container-high: rgba(255, 255, 255, 0.75);
            
            --md-on-surface: #191c1e;
            --md-on-surface-variant: #42474e;
            --md-outline: #72777f;
            
            --md-elevation-1: 0px 1px 2px 0px rgba(0,0,0,0.3), 0px 1px 3px 1px rgba(0,0,0,0.15);
            --md-elevation-3: 0px 1px 3px 0px rgba(0,0,0,0.3), 0px 4px 8px 3px rgba(0,0,0,0.15);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Roboto', sans-serif; 
            overflow: hidden; 
            background: #f4f6fa;
            -webkit-tap-highlight-color: transparent;
        }
        
        #map { width: 100vw; height: 100vh; z-index: 1; }
        .leaflet-control-attribution { display: none; }

        
        .top-search-container {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 420px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-branding {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7), 0px 0px 6px rgba(0, 0, 0, 0.5);

            
            -webkit-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }
        .logo-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-logo {
            height: 24px;
            width: 24px;
            object-fit: contain;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.6));

            
            -webkit-user-drag: none;
        }
        .app-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900; 
            font-size: 22px;
            color: #ffffff; 
            letter-spacing: -0.5px;
        }
        .sponsor-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500; 
            font-size: 11px;
            color: #ffffff; 
            margin-top: 2px;
        }
        .sponsor-text a {
            font-weight: 800; 
            font-style: italic;
            color: #ffffff; 
            text-decoration: none; 
        }

        .search-box {
            background: var(--md-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 100px;
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
        }
        .search-box:focus-within {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .search-icon { color: var(--md-outline); font-size: 18px; }
        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            padding: 0 12px;
            font-size: 15px;
            font-family: 'Roboto', sans-serif;
            color: var(--md-on-surface);
        }
        .search-box input::placeholder { color: var(--md-outline); font-weight: 400; }
        .clear-icon { color: var(--md-outline); font-size: 18px; cursor: pointer; display: none; }

        .search-results {
            background: var(--md-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            overflow-y: auto;
            flex-direction: column;
            border: 1px solid transparent; 

            
            display: flex; 
            opacity: 0;
            visibility: hidden;
            max-height: 0; 
            transform: translateY(-10px); 
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
        }
        .search-results.active {
            opacity: 1;
            visibility: visible;
            max-height: 40vh; 
            transform: translateY(0); 
            border-color: rgba(255, 255, 255, 0.6); 
        }
        .result-item {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.2s;
        }
        .result-item:last-child { border-bottom: none; }
        .result-item:active { background: rgba(0,0,0,0.05); }
        .result-icon {
            width: 36px; height: 36px;
            background: var(--md-surface-container-high);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--md-primary);
            flex-shrink: 0; font-size: 14px;
        }
        .result-info { flex: 1; overflow: hidden; }
        .result-name { font-weight: 600; font-size: 15px; color: var(--md-on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .result-desc { font-size: 12px; color: var(--md-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;}

        
        .floating-controls {
            position: absolute;
            top: 130px; 
            right: 16px;
            z-index: 1000;
            display: none;
        }
        .floating-controls.visible {
            display: block;
        }
        .fab {
            width: 56px; height: 56px;
            background: var(--md-primary-container); color: var(--md-primary);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(81, 112, 255, 0.2);
            border-radius: 16px; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--md-elevation-3); cursor: pointer; font-size: 24px; transition: all 0.2s ease;
        }
        .fab:active { background: rgba(81, 112, 255, 0.25); transform: scale(0.96); }
        .fab.disabled {
            background: var(--md-surface-container); color: var(--md-outline); opacity: 0.8; box-shadow: var(--md-elevation-1);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .bus-marker-img {
            width: 17px; height: 17px; 
            transition: transform 1s linear, top 1s linear, left 1s linear;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
        }

        
        .bottom-sheet {
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: var(--md-surface);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px 28px 0 0; box-shadow: 0 -4px 24px rgba(0,0,0,0.1); z-index: 2000;
            transform: translateY(110%); transition: transform 0.35s cubic-bezier(0.2, 0, 0, 1);
            display: flex; flex-direction: column; max-height: 85vh;
        }
        .bottom-sheet.active { transform: translateY(0); }
        .sheet-handle-container { 
            width: 100%; display: flex; justify-content: center; padding: 16px 0; 
            cursor: grab;
        }
        .sheet-handle-container:active { cursor: grabbing; }
        .sheet-handle { width: 32px; height: 4px; background: var(--md-outline); opacity: 0.5; border-radius: 2px; }
        .sheet-content { padding: 0 20px 24px 20px; overflow-y: auto; }

        
        .bus-card { 
            background: var(--md-surface-container); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px; padding: 20px; display: flex; gap: 16px; align-items: center; 
        }
        .route-badge { background: var(--md-primary); color: var(--md-on-primary); width: 64px; height: 64px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
        .route-badge .num { font-size: 24px; font-weight: 700; line-height: 1; }
        .route-badge .plate { font-size: 11px; margin-top: 4px; font-weight: 500; opacity: 0.9; }
        .bus-info { flex: 1; }
        .bus-info .title { font-size: 18px; font-weight: 600; color: var(--md-on-surface); margin-bottom: 4px; line-height: 1.3;}
        .bus-info .status { font-size: 14px; color: var(--md-primary); font-weight: 500; display: flex; align-items: center; gap: 6px;}

        
        .stop-header { font-size: 22px; font-weight: 700; color: var(--md-on-surface); margin-bottom: 16px; }
        .route-section { margin-bottom: 20px; }
        .route-section-title { font-size: 15px; font-weight: 700; color: var(--md-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .bus-list { 
            background: var(--md-surface-container); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; 
        }
        .bus-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(0,0,0,0.04); cursor: pointer; transition: background 0.2s; }
        .bus-item:active { background: var(--md-surface-container-high); }
        .bus-item:last-child { border-bottom: none; }
        .bus-item-left .plate {
    font-size: 14px;
    font-weight: 700;
    color: #ffffff; 
    background-color: var(--md-primary); 
    padding: 6px 12px; 
    border-radius: 6px; 
    display: inline-block;
    letter-spacing: 0.5px; 
    box-shadow: 0 2px 6px rgba(81, 112, 255, 0.3); 
}
        .bus-item-right { text-align: right; }
        .bus-item-time { font-size: 18px; font-weight: 700; color: var(--md-primary); }
        .bus-item-dist { font-size: 13px; color: var(--md-on-surface-variant); margin-top: 2px;}
        .empty-state { text-align: center; padding: 24px; color: var(--md-on-surface-variant); font-size: 14px; }
    </style>
</head>
<body>

    <div id="map"></div>

    
    <div class="top-search-container">
        
        <div class="header-branding">
            <div class="logo-title-row">
                <img src="/hbds-map/logo.png" alt="Logo" class="top-logo" draggable="false">
                <span class="app-title">HBDS Map</span>
            </div>
            <div class="sponsor-text">
                Tài trợ bởi <a href="https://vnbusarchive.qzz.io/" target="_blank">VNBUSARCHIVE</a>
            </div>
        </div>

        
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" placeholder="Tìm trạm dừng, địa điểm...">
            <i class="fa-solid fa-circle-xmark clear-icon" id="clearSearch"></i>
        </div>

        
        <div class="search-results" id="searchResults"></div>
    </div>

    
    <div class="floating-controls" id="floatingControls">
        <div class="fab disabled" id="btnCenterMap" onclick="centerOnTrackedBus(event)">
            <i class="fa-solid fa-location-crosshairs"></i>
        </div>
    </div>

    
    <div class="bottom-sheet" id="bottomSheet">
        
        <div class="sheet-handle-container" id="sheetHandle" onclick="closeSheet()">
            <div class="sheet-handle"></div>
        </div>
        <div class="sheet-content" id="sheetContent"></div>
    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let FIREBASE_URL = ""; // Khởi tạo biến trống

        // 1. Hàm khởi tạo ứng dụng sau khi lấy được config
        async function initApp() {
            try {
                const response = await fetch('/api/config'); // Gọi đến serverless function
                const config = await response.json();
                FIREBASE_URL = config.FIREBASE_URL;

                if (!FIREBASE_URL) {
                    console.error("Không tìm thấy FIREBASE_URL trong Environment Variables!");
                    return;
                }

                // Sau khi có URL mới bắt đầu chạy các hàm fetch dữ liệu
                loadStopsData();
                setInterval(fetchBuses, 10000);
                fetchBuses();

            } catch (err) {
                console.error("Lỗi lấy cấu hình từ server:", err);
            }
        }

        // 2. Các logic bản đồ giữ nguyên (nhưng lưu ý dời việc gọi hàm vào initApp)
        const STOPS_JSON_URL = "/hbds-map/stops.json";
        const map = L.map('map', { zoomControl: false }).setView([21.0258210, 105.8020055], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);

        const busesLayer = L.layerGroup().addTo(map);
        const stopsLayer = L.layerGroup().addTo(map);

        let activeBuses = {}; 
        let globalBusData = {}; 
        let globalStopsData =[];

        let trackedBusId = null;
        let isFollowing = false;
        const btnCenterMap = document.getElementById('btnCenterMap');
        const floatingControls = document.getElementById('floatingControls');

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const clearSearch = document.getElementById('clearSearch');
        let searchTimeout = null;

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            if (val.length > 0) {
                clearSearch.style.display = 'block';
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => performSearch(val), 400);
            } else {
                clearSearch.style.display = 'none';
                searchResults.classList.remove('active'); // Đóng bảng mượt mà khi xóa hết chữ
            }
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.remove('active');
            }
        });

        // Nút X để xóa nhanh
        clearSearch.addEventListener('click', () => {
            searchInput.value = '';
            clearSearch.style.display = 'none';
            searchResults.classList.remove('active');
            searchInput.focus();
        });

        async function performSearch(query) {
            let resultsHTML = '';
            let hasResult = false;
            const lowerQuery = query.toLowerCase();

            const matchedStops = globalStopsData.filter(s => s.name && s.name.toLowerCase().includes(lowerQuery)).slice(0, 3);
            
            if (matchedStops.length > 0) {
                hasResult = true;
                matchedStops.forEach(stop => {
                    if (stop.lat !== 0 && stop.lng !== 0) {
                        const stopJSON = JSON.stringify(stop).replace(/"/g, '&quot;');
                        resultsHTML += `
                            <div class="result-item" onclick="onStopResultClick(${stopJSON})">
                                <div class="result-icon"><i class="fa-solid fa-bus-simple"></i></div>
                                <div class="result-info">
                                    <div class="result-name">${stop.name}</div>
                                    <div class="result-desc">Trạm dừng xe buýt</div>
                                </div>
                            </div>
                        `;
                    }
                });
            }

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=4&countrycodes=vn`);
                const osmResults = await res.json();
                
                if (osmResults && osmResults.length > 0) {
                    hasResult = true;
                    osmResults.forEach(item => {
                        const mainName = item.display_name.split(',')[0]; 
                        resultsHTML += `
                            <div class="result-item" onclick="onOSMResultClick(${item.lat}, ${item.lon})">
                                <div class="result-icon"><i class="fa-solid fa-location-dot"></i></div>
                                <div class="result-info">
                                    <div class="result-name">${mainName}</div>
                                    <div class="result-desc">${item.display_name}</div>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                console.error("OSM Search failed:", err);
            }

            if (hasResult) {
                searchResults.innerHTML = resultsHTML;
                searchResults.classList.add('active');
            } else {
                searchResults.innerHTML = `<div class="result-item"><div class="result-info"><div class="result-name" style="text-align:center; color: var(--md-outline); font-weight: 500;">Không tìm thấy kết quả</div></div></div>`;
                searchResults.classList.add('active');
            }
        }

        window.onStopResultClick = function(stop) {
            searchResults.classList.remove('active');
            searchInput.blur();
            map.flyTo([stop.lat, stop.lng], 17, {animate: true});
            openStopSheet(stop);
        }

        window.onOSMResultClick = function(lat, lng) {
            searchResults.classList.remove('active');
            searchInput.blur();
            map.flyTo([lat, lng], 17, {animate: true});
        }


        // ================= 3. LOGIC TRACKING VÀ TRẠM DỪNG =================
        const AVG_SPEED_METERS_PER_MIN = 500;

        function game_to_real_affine(x_game, z_game) {
            const A = -0.0000012963586;
            const B = 0.0000008516483;
            const C = 105.8416820000000;

            const D = 0.0000008066186;
            const E = 0.0000011138671;
            const F = 21.0237160000000;

            const lat = (D * x_game) + (E * z_game) + F;
            const lng = (A * x_game) + (B * z_game) + C;

            return [lat, lng];
        }

        const stopIcon = L.icon({ iconUrl: '/hbds-map/stop.png', iconSize:[26, 26], iconAnchor:[13, 13] });
        let renderedStops = {}; 
        const ZOOM_THRESHOLD = 16; 

        async function loadStopsData() {
            try {
                const response = await fetch(STOPS_JSON_URL);
                if (response.ok) {
                    globalStopsData = await response.json();
                    updateVisibleStops();
                }
            } catch (error) { console.error("Lỗi tải trạm dừng:", error); }
        }

        function updateVisibleStops() {
            const currentZoom = map.getZoom();
            if (currentZoom < ZOOM_THRESHOLD) {
                stopsLayer.clearLayers();
                renderedStops = {};
                return;
            }
            const bounds = map.getBounds().pad(0.1); 
            const newRendered = {};

            globalStopsData.forEach((stop, index) => {
                if (stop.lat === 0 || stop.lng === 0) return;
                const latlng = L.latLng(stop.lat, stop.lng);

                if (bounds.contains(latlng)) {
                    if (renderedStops[index]) {
                        newRendered[index] = renderedStops[index];
                        delete renderedStops[index]; 
                    } else {
                        const marker = L.marker([stop.lat, stop.lng], { icon: stopIcon });
                        marker.on('click', (e) => {
                            L.DomEvent.stopPropagation(e);
                            openStopSheet(stop);
                        });
                        stopsLayer.addLayer(marker);
                        newRendered[index] = marker;
                    }
                }
            });
            for (const key in renderedStops) { stopsLayer.removeLayer(renderedStops[key]); }
            renderedStops = newRendered;
        }

        map.on('moveend', updateVisibleStops);
        map.on('zoomend', updateVisibleStops);

        map.on('click', function(e) {
            searchResults.classList.remove('active');
            let nearestStop = null;
            let minDist = Infinity;
            globalStopsData.forEach(stop => {
                if(stop.lat === 0 || stop.lng === 0) return;
                const dist = map.distance(e.latlng,[stop.lat, stop.lng]);
                if(dist < 40 && dist < minDist) { nearestStop = stop; minDist = dist; }
            });
            if(nearestStop) openStopSheet(nearestStop); else closeSheet();
        });

        map.on('dragstart', () => {
            if(trackedBusId) { isFollowing = false; btnCenterMap.classList.remove('disabled'); }
        });

        // ---------- THÊM MỚI TỪ ĐÂY ----------
        // Chặn lỗi click xuyên qua nút bấm xuống bản đồ
        if (floatingControls) {
            L.DomEvent.disableClickPropagation(floatingControls);
            L.DomEvent.disableScrollPropagation(floatingControls);
        }

        // Viết lại hàm căn giữa chuẩn xác hơn
        window.centerOnTrackedBus = function(e) {
            if (e) e.stopPropagation(); // Ngăn sự kiện sủi bọt

            // Nếu xe vẫn đang tồn tại trên bản đồ
            if (trackedBusId && activeBuses[trackedBusId]) {
                isFollowing = true;
                map.panTo(activeBuses[trackedBusId].getLatLng(), { animate: true });
                btnCenterMap.classList.add('disabled');
            }
        };
        // ---------- ĐẾN ĐÂY ----------

        async function fetchBuses() {
            if (!FIREBASE_URL) return; // Nếu chưa có URL thì thoát
            try {
                const response = await fetch(FIREBASE_URL);
                const data = await response.json();
                if (!data) return;

                const now = Date.now();
                const currentIds = new Set();
                globalBusData = {};

                const processBus = (bus, busId) => {
                    if (!bus || typeof bus !== 'object') return;
                    if (now - bus.lastPing > 25000) return;

                    currentIds.add(busId);
                    const finalCoords = game_to_real_affine(bus.x, bus.z);
                    bus.latLng = finalCoords;
                    globalBusData[busId] = bus;

                    const rotationDeg = (bus.heading || 0) + 163;

                    if (activeBuses[busId]) {
                        activeBuses[busId].setLatLng(finalCoords);
                        const imgElem = activeBuses[busId].getElement().querySelector('img');
                        if(imgElem) imgElem.style.transform = `rotate(${rotationDeg}deg)`;
                    } else {
                        const busHtml = `<img src="/hbds-map/bus.png" class="bus-marker-img" style="transform: rotate(${rotationDeg}deg);" />`;
                        // Cập nhật lại iconSize và iconAnchor
                        const icon = L.divIcon({ html: busHtml, className: '', iconSize:[17, 17], iconAnchor:[8.5, 8.5] });

                        const marker = L.marker(finalCoords, { icon: icon }).addTo(busesLayer);
                        marker.on('click', (e) => { L.DomEvent.stopPropagation(e); openBusSheet(bus, busId); });
                        activeBuses[busId] = marker;
                    }

                    if (trackedBusId === busId && isFollowing) {
                        map.panTo(finalCoords, { animate: true, duration: 1.0 });
                    }
                };

                for (const key in data) {
                    const item = data[key];
                    if (!item) continue;

                    if (item.x !== undefined && item.z !== undefined) {
                        processBus(item, key);
                    }
                    else {
                        for (const busId in item) {
                            processBus(item[busId], busId);
                        }
                    }
                }

                for (const id in activeBuses) {
                    if (!currentIds.has(id)) {
                        busesLayer.removeLayer(activeBuses[id]);
                        delete activeBuses[id];
                    }
                }
            } catch (err) { console.error("Lỗi:", err); }
        }

        // ================= BOTTOM SHEET LOGIC =================
        const sheet = document.getElementById('bottomSheet');
        const content = document.getElementById('sheetContent');
        const handle = document.getElementById('sheetHandle');

        let startY = 0;
        let currentY = 0;
        let isDraggingSheet = false;

        handle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            currentY = startY;
            isDraggingSheet = true;
            sheet.style.transition = 'none'; 
        }, { passive: true });

        handle.addEventListener('touchmove', (e) => {
            if (!isDraggingSheet) return;
            currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            if (diff > 0) { 
                sheet.style.transform = `translateY(${diff}px)`;
            }
        }, { passive: true });

        handle.addEventListener('touchend', () => {
            if (!isDraggingSheet) return;
            isDraggingSheet = false;
            sheet.style.transition = ''; 
            const diff = currentY - startY;
            
            if (diff > 50) { 
                closeSheet();
            } else {
                sheet.style.transform = ''; 
            }
        });

        function closeSheet() {
            sheet.classList.remove('active'); 
            sheet.style.transform = ''; 
            trackedBusId = null; 
            isFollowing = false; 
            floatingControls.classList.remove('visible'); 
            btnCenterMap.classList.add('disabled');
        }

        window.openBusSheet = function(bus, busId) {
            trackedBusId = busId; 
            isFollowing = true; 
            floatingControls.classList.add('visible'); 
            btnCenterMap.classList.add('disabled');

            if(activeBuses[busId]) map.flyTo(activeBuses[busId].getLatLng(), 16, {animate: true});

            content.innerHTML = `
                <div class="bus-card">
                    <div class="route-badge">
                        <span class="num">${bus.routeNum || '--'}</span>
                        <span class="plate">${bus.plate || '---'}</span>
                    </div>
                    <div class="bus-info">
                        <div class="title">${bus.routeName || 'Đang cập nhật...'}</div>
                        <div class="status"><i class="fa-solid fa-satellite-dish"></i> Đang theo dõi trực tiếp</div>
                    </div>
                </div>
            `;
            sheet.classList.add('active');
        }

        function openStopSheet(stop) {
            let routesHtml = '';
            (stop.routes ||[]).forEach(route => {
                const busesOnRoute = Object.entries(globalBusData).filter(([id, b]) => b.routeNum === route);
                let busListHtml = '';
                
                if (busesOnRoute.length > 0) {
                    const finalBuses = busesOnRoute.map(([id, b]) => {
                        const distMeters = map.distance([stop.lat, stop.lng], b.latLng);
                        const timeMin = Math.ceil(distMeters / AVG_SPEED_METERS_PER_MIN);
                        return { id, b, distMeters, timeMin };
                    }).sort((a, b) => a.timeMin - b.timeMin);

                    finalBuses.forEach(item => {
                        const distText = item.distMeters < 1000 ? `${Math.round(item.distMeters)} m` : `${(item.distMeters / 1000).toFixed(1)} km`;
                        busListHtml += `
                            <div class="bus-item" onclick="openBusSheet(globalBusData['${item.id}'], '${item.id}')">
                                <div class="bus-item-left"><div class="plate">${item.b.plate}</div></div>
                                <div class="bus-item-right">
                                    <div class="bus-item-time">${item.timeMin} Phút</div>
                                    <div class="bus-item-dist">Cách ${distText}</div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    busListHtml = `<div class="empty-state">Hiện không có xe nào sắp tới.</div>`;
                }

                routesHtml += `<div class="route-section"><div class="route-section-title"><i class="fa-solid fa-route"></i> Tuyến ${route}</div><div class="bus-list">${busListHtml}</div></div>`;
            });

            if(!routesHtml) routesHtml = `<div class="empty-state">Trạm này chưa có dữ liệu tuyến.</div>`;

            content.innerHTML = `<div class="stop-header">${stop.name}</div><div>${routesHtml}</div>`;
            sheet.classList.add('active');
        }

        // 3. Cuối cùng, gọi hàm khởi động
        initApp();

    </script>
</body>
</html>

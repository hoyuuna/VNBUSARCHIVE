<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | VNBUSARCHIVE</title>
    <link rel="icon" href="/media/icon.png">
    
    <meta name="theme-color" content="#f4f4f5">
    <meta name="title" content="404 | VNBUSARCHIVE">
    
    <link href="/tailwind.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            -webkit-font-smoothing: antialiased !important;
            -moz-osx-font-smoothing: grayscale !important;
            text-shadow: 0 0 0.5px rgba(0, 0, 0, 0.15);
            background-color: #f4f4f5; 
            color: #09090b;
            overflow: hidden; 
        }

        .font-watermark {
            font-family: 'Montserrat', sans-serif !important;
        }

        .fade-zoom-in {
            animation: fadeZoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeZoomIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(15px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .text-404 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            background: linear-gradient(135deg, #e4e4e7 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 10px 20px rgba(0,0,0,0.05);
            line-height: 1;
        }

        .bg-pattern {
            background-image: radial-gradient(#d4d4d8 1.5px, transparent 1.5px);
            background-size: 28px 28px;
        }
    </style>
</head>

<body class="bg-pattern relative h-screen w-screen flex items-center justify-center p-4">

    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[5%] left-[15%] w-80 h-80 bg-gray-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-pulse"></div>
        <div class="absolute bottom-[10%] right-[15%] w-72 h-72 bg-gray-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
    </div>

    <div class="relative z-10 w-full max-w-md bg-white/80 backdrop-blur-2xl border border-white rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] p-8 md:p-10 text-center flex flex-col items-center fade-zoom-in">
        
        <div class="flex items-center justify-center gap-2 mb-8">
            <img src="/media/vnba.png" alt="VNBUSARCHIVE Logo" class="h-10 w-auto object-contain drop-shadow-sm" decoding="async">
            <span class="font-watermark font-extrabold italic text-2xl tracking-wider text-black mt-1 drop-shadow-sm">VNBUSARCHIVE</span>
        </div>

        <div class="relative flex items-center justify-center w-full mb-8">
            <span class="text-404 text-[130px] md:text-[150px] absolute z-0 select-none tracking-tighter">404</span>
            
            <div class="relative inline-flex z-10 mt-6 transform hover:scale-110 transition-transform duration-300">
                <div class="w-20 h-20 min-w-[5rem] min-h-[5rem] bg-black text-white rounded-full flex items-center justify-center text-3xl shadow-xl border-4 border-white shrink-0 aspect-square">
                    <i class="fa-solid fa-bus-simple"></i>
                </div>
                
                <div class="absolute -bottom-1 -right-1 w-8 h-8 min-w-[2rem] min-h-[2rem] bg-red-500 text-white rounded-full flex items-center justify-center text-sm border-2 border-white shadow-md shrink-0 aspect-square">
                    <i class="fa-solid fa-location-crosshairs"></i>
                </div>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-black mb-3 tracking-tight">Chuyến xe không tồn tại!</h2>
        <p class="text-[13px] text-gray-500 font-medium leading-relaxed mb-8 px-2">
            Có vẻ như bạn đã đi lạc tuyến. Đường dẫn, hình ảnh hoặc hồ sơ xe này đã bị gỡ bỏ khỏi hệ thống hoặc không tồn tại.
        </p>

        <div class="w-full flex flex-col gap-3">
            <button onclick="window.location.href='/'" class="w-full bg-black text-white py-3.5 rounded-xl font-bold text-sm hover:bg-gray-800 transition shadow-lg flex justify-center items-center gap-2 group">
                <i class="fa-solid fa-house group-hover:-translate-y-0.5 transition-transform"></i> Về Trang chủ
            </button>
            <button onclick="history.back()" class="w-full bg-white border border-gray-200 text-gray-700 py-3.5 rounded-xl font-bold text-sm hover:bg-gray-50 transition shadow-sm flex justify-center items-center gap-2 group">
                <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i> Quay lại trang trước
            </button>
        </div>

        <div class="mt-8 text-center">
            <a href="/contact" class="text-[11px] text-gray-500 font-bold hover:text-black transition-colors inline-flex items-center gap-1.5 underline decoration-gray-300 hover:decoration-black">
                <i class="fa-solid fa-headset"></i> Liên hệ hỗ trợ
            </a>
        </div>

    </div>
</body>
</html>

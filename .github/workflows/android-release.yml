name: Android Build & Pre-Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compute Version Info
        id: version_info
        run: |
          RUN_NUM="${{ github.run_number }}"
          # x tự tăng bắt đầu từ 0 (run_number 2 tương ứng với x = 0)
          X=$(( RUN_NUM - 2 ))
          if [ $X -lt 0 ]; then
            X=0
          fi
          VERSION_NAME="0.1.${X}"
          VERSION_CODE=$(( X + 1 ))
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_NAME="VNBUSARCHIVE-v${VERSION_NAME}.apk"
          TAG_NAME="v${VERSION_NAME}"

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          cd android
          gradle :app:assembleRelease \
            -PversionCode=${{ steps.version_info.outputs.version_code }} \
            -PversionName=${{ steps.version_info.outputs.version_name }} \
            --no-daemon

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="${{ steps.version_info.outputs.apk_name }}"
          cp "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: "VNBUSARCHIVE Android v${{ steps.version_info.outputs.version_name }}"
          prerelease: true
          draft: false
          body: |
            VNBUSARCHIVE Android
            Commit: [${{ steps.version_info.outputs.short_sha }}]
            Phiên bản này được build tự động

            | File | Nền tảng |
            | :--- | :--- |
            | `${{ steps.version_info.outputs.apk_name }}` | Android (Universal: ARM64, ARMv7, x86, x86_64 - Android 8.0+) |
          files: ${{ steps.prepare_asset.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

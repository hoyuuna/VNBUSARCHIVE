name: Android Build & Pre-Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: |
          cd android
          gradle :app:assembleRelease --no-daemon

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          BUILD_NUM="${{ github.run_number }}"
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_NAME="VNBUSARCHIVE-v1.0.0-b${BUILD_NUM}.apk"
          cp "$APK_SRC" "$APK_NAME"
          echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=android-v1.0.0-b${BUILD_NUM}" >> $GITHUB_OUTPUT

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_asset.outputs.tag_name }}
          name: "VNBUSARCHIVE Android v1.0.0 (Pre-release Build ${{ github.run_number }})"
          prerelease: true
          draft: false
          body: |
            ### 🚌 VNBUSARCHIVE Android Native Hybrid App
            - **Build Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            - **Tính năng nổi bật:**
              - Hỗ trợ chạy ngầm Foreground Service & WorkManager khi nén/upload nhiều ảnh.
              - Tải ảnh trực tiếp vào Thư viện ảnh (Pictures/Gallery).
              - Nhận ảnh chia sẻ trực tiếp từ Camera / Google Photos (Share Intent).
              - Giao diện đồng bộ 100% với phiên bản Web mới nhất.
            
            *File APK đã được tự động ký để cài đặt trực tiếp trên các thiết bị Android.*
          files: ${{ steps.prepare_asset.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
